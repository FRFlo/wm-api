services:
  mitmweb:
    image: docker.io/mitmproxy/mitmproxy:latest
    container_name: wiki-masters-mitmweb
    command:
      - mitmweb
      - --web-host
      - 0.0.0.0
      - --web-port
      - "8081"
      - --listen-host
      - 0.0.0.0
      - --listen-port
      - "8080"
      - --set
      - web_open_browser=false
      - --set
      - web_password=admin
    network_mode: host
    volumes:
      - ./captures:/home/mitmproxy/.mitmproxy
